[project]
name = "marketplace-risk-ml-service"
version = "0.1.0"
description = "ML service skeleton for real-time marketplace risk scoring."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "marketplace-risk-scoring contributors" }
]
dependencies = [
    "fastapi>=0.136.3",
    "joblib>=1.5.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "psycopg[binary]>=3.3.4",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "ruff>=0.16.5",
]
training = [
    "mlflow>=1.27.0",
    "protobuf<4",
    "setuptools<82",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
