services:
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    image: marketplace-risk-ml-service
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: