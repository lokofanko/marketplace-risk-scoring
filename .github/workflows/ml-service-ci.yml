name: ML Service CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print working directory
        run: pwd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Print Python version
        run: python --version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Print uv version
        run: uv --version

      - name: List repository files
        run: ls -la

      - name: Install ML service dependencies
        working-directory: ml_service
        run: uv sync

      - name: Check ML service Python imports
        working-directory: ml_service
        run: uv run python -c "import fastapi, pandas, sklearn, joblib; print('imports ok')"

      - name: Print hello
        run: echo "ML Service CI started"